<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #1e293b;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 200px;
            box-shadow: 0 2px 8px #00000010;
        }

        .card h3 {
            color: #64748b;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <h1>Hospital Dashboard</h1>
    <p>Welcome to your dashboard</p>

    <div class="cards">

        <div class="card">
            <h3>Total Suppliers</h3>
            <p>12</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p>48</p>
        </div>

        <div class="card">
            <h3>Completed Orders</h3>
            <p>35</p>
        </div>

    </div>

</body>
</html>
